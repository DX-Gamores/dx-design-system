name: Update visual baselines

# Run this after an intended visual change (or once after setup): it re-captures every
# snapshot on CI's own machine and commits them, so CI compares like with like.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - name: Re-capture snapshots
        run: npx playwright test tests/visual.spec.ts --update-snapshots
      - name: Commit the new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual.spec.ts-snapshots
          git diff --cached --quiet && echo "Baselines unchanged." && exit 0
          git commit -m "Update visual baselines (CI)"
          git push
