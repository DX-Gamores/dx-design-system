name: CI

# Every push and pull request: generated files fresh, Figma ↔ code parity, types, build, tests.
# The docs site itself is deployed by Vercel (see docs/DEPLOY.md): production on main, a preview per pull request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Parity, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generated files are up to date (tokens, icons, specs, registry)
        run: |
          npm run build:all
          git diff --exit-code -- dist tokens docs src/components/ui/icons.generated.tsx src/site/lucide-names.json src/site/component-data.json src/site/redirects.json src/examples/index.ts src/blocks/index.ts registry.json public/r \
            || (echo "::error::Generated files are stale. Run 'npm run build:all' and commit the result." && exit 1)

      - name: Figma ↔ code parity and types
        run: npm run check

      - name: Build the docs site (static export, served to the tests below)
        run: npm run build:pages

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Keyboard, accessibility (WCAG 2.2) and link tests
        run: npm run test:functional

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 7

  visual:
    name: Visual regression (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out
      - run: npx playwright install --with-deps chromium
      - name: Compare with the committed baselines
        run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report
            test-results
          retention-days: 14

